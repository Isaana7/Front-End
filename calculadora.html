<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <style>
        .campo{
            background-color: white;
            border:5px solid green;
        }
        .botão{
            width: 5%;
            height: 5%;
            background-color:white;
            border:2px solid green;
        }
        .botãoo{
            width: 5%;
            height: 5%;
            background-color:white;
            border:2px solid green;
        }
        .botão1{
            width: 5%;
            height: 5%;
            background-color:white;
            border:2px solid green;
        }
        .botãooo{
            width: 5%;
            height: 5%;
            background-color:white;
            border:2px solid green;
        }







    </style>

</head>
<body>
    
    <fieldset>
        <legend>
            Calculadora Isaac 
        </legend>
        <input type="text"id="campo"class="campo"><br><br>
        <button class="botão">1</button>
        <button class="botão">2</button>
        <button class="botão">3</button>
        <button class="botãoo">-</button>
        <button class="botãoo">+</button>
        <br>
        <button class="botão">5</button>
        <button class="botão">6</button>
        <button class="botão">7</button>
        <button class="botão1">=</button>
        <button class="botãoo">^</button>
        <br>
        <button class="botão">8</button>
        <button class="botão">9</button>
        <button class="botão">0</button>
        <button class="botãoo">/</button>
        <button class="botãoo">(</button>
        <br>
        <button class="botãoo">)</button>
        <button class="botãoo">*</button>
        <button class="botãoo">#</button>
        <button class="botãoo">%</button>
        <button class="botãooo">C</button>
        <br>
        <button class="botãoo">x</button>
        <button class="botão">1</button>
        <button class="botão">1</button>
    </fieldset>
    
</body>
</html>
