<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>

    <style>
        .campo {
            background-color: white;
            border: 5px solid green;
            width: 250px;
            height: 40px;
            font-size: 20px;
        }

        .botão,
        .botãoo,
        .botão1,
        .botãooo {
            width: 50px;
            height: 50px;
            background-color: white;
            border: 2px solid green;
            font-size: 18px;
            cursor: pointer;
        }

        .botão:hover,
        .botãoo:hover,
        .botão1:hover,
        .botãooo:hover {
            background-color: lightgreen;
            transition: 0.2s;
        }

        fieldset {
            width: 300px;
            margin: auto;
            margin-top: 50px;
            padding: 20px;
        }

        legend {
            font-size: 25px;
            font-weight: bold;
        }
    </style>

    <script>
        function adicionar(valor) {
            document.getElementById("campo").value += valor;
        }

        function limpar() {
            document.getElementById("campo").value = "";
        }

        function calcular() {
            var campo = document.getElementById("campo");

            try {
                campo.value = eval(campo.value);
            }

            catch (error) {
                campo.value = "Erro";
            }
        }
    </script>
</head>

<body>

    <fieldset>

        <legend>
            Calculadora Isaac
        </legend>

        <input type="text" id="campo" class="campo">

        <br><br>

        <button class="botão" onclick="adicionar('1')">1</button>
        <button class="botão" onclick="adicionar('2')">2</button>
        <button class="botão" onclick="adicionar('3')">3</button>
        <button class="botãoo" onclick="adicionar('-')">-</button>
        <button class="botãoo" onclick="adicionar('+')">+</button>

        <br><br>

        <button class="botão" onclick="adicionar('4')">4</button>
        <button class="botão" onclick="adicionar('5')">5</button>
        <button class="botão" onclick="adicionar('6')">6</button>
        <button class="botãoo" onclick="adicionar('/')">/</button>
        <button class="botãoo" onclick="adicionar('*')">x</button>

        <br><br>

        <button class="botão" onclick="adicionar('7')">7</button>
        <button class="botão" onclick="adicionar('8')">8</button>
        <button class="botão" onclick="adicionar('9')">9</button>
        <button class="botãoo" onclick="adicionar('(')">(</button>
        <button class="botãoo" onclick="adicionar(')')">)</button>

        <br><br>

        <button class="botão" onclick="adicionar('0')">0</button>
        <button class="botãoo" onclick="adicionar('.')">.</button>
        <button class="botãoo" onclick="adicionar('%')">%</button>
        <button class="botão1" onclick="calcular()">=</button>
        <button class="botãooo" onclick="limpar()">C</button>

    </fieldset>

</body>

</html>
