<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <style>
        .campo{
            background-color: white;
            border:5px solid green;
        }
        .botão{
            width: 5%;
            height: 5%;
            background-color:white;
            border:2px solid green;
        }
        .botãoo{
            width: 5%;
            height: 5%;
            background-color:white;
            border:2px solid green;
        }
        .botão1{
            width: 5%;
            height: 5%;
            background-color:white;
            border:2px solid green;
        }
        .botãooo{
            width: 5%;
            height: 5%;
            background-color:white;
            border:2px solid green;
        }
    </style>
    <script>
      function adicionar(valor){
        document.getElementById("campo").value += valor;   
      }
      function limpar(){
        document.getElementById("campo").value = "";


      }
    </script>
</head>
<body>
    
    <fieldset>
        <legend>
            Calculadora Isaac 
        </legend>
        <input type="text"id="campo"class="campo"><br><br>
        <button class="botão" onclick="adicionar('1')">1</button>
        <button class="botão" onclick="adicionar('2')">2</button>
        <button class="botão" onclick="adicionar('3')">3</button>
        <button class="botãoo" onclick="adicionar('-')">-</button>
        <button class="botãoo" onclick="adicionar('+')">+</button>
        <br>
        <button class="botão" onclick="adicionar('5')">5</button>
        <button class="botão" onclick="adicionar('6')">6</button>
        <button class="botão" onclick="adicionar('7')">7</button>
        <button class="botão1" onclick="adicionar('=')">=</button>
        <button class="botãoo" onclick="adicionar('^')">^</button>
        <br>
        <button class="botão" onclick="adicionar('8')">8</button>
        <button class="botão" onclick="adicionar('9')">9</button>
        <button class="botão" onclick="adicionar('0')">0</button>
        <button class="botãoo" onclick="adicionar('/')">/</button>
        <button class="botãoo" onclick="adicionar('(')">(</button>
        <br>
        <button class="botãoo" onclick="adicionar(')')">)</button>
        <button class="botãoo" onclick="adicionar('*')">*</button>
        <button class="botãoo" onclick="adicionar('#')">#</button>
        <button class="botãoo" onclick="adicionar('%')">%</button>
        <button class="botãooo" onclick="limpar()">C</button>
        <br>
        <button class="botãoo" onclick="adicionar('x')">x</button>
    </fieldset>
    
</body>
</html>
